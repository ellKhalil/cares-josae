<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#073822;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0e5a36;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5b041;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c98a1a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Sprout / Shield Symbol -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="100" height="100" rx="20" fill="url(#gradGreen)" />
    <!-- Leaf icon -->
    <path d="M50,20 C65,20 80,35 80,55 C80,75 50,85 50,85 C50,85 20,75 20,55 C20,35 35,20 50,20 Z" fill="#ffffff" opacity="0.15"/>
    <path d="M50,25 C62,38 72,52 68,68 C65,74 58,80 50,82 C42,80 35,74 32,68 C28,52 38,38 50,25 Z" fill="url(#gradGold)"/>
    <path d="M50,30 L50,78 M50,45 C56,40 62,42 64,48 M50,55 C44,50 38,52 36,58" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Typography -->
  <text x="125" y="52" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="42" fill="#073822" letter-spacing="1.5">CARES</text>
  <text x="125" y="76" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="13" fill="#c98a1a" letter-spacing="0.5">CENTRE FOR AGRICULTURAL RESEARCH</text>
  <text x="125" y="94" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="600" font-size="12" fill="#64748b" letter-spacing="0.5">&amp; EXTENSION SERVICES • FUD</text>
</svg>
